app = "aptitude-connect-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs inside the new release container before traffic is shifted.
  # Applies pending Prisma migrations atomically on every deploy.
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT     = "3000"

[http_service]
  internal_port      = 3000
  force_https        = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 512
