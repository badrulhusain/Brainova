name: Deploy

on:
  push:
    branches: [main]

# Only one deployment runs at a time; in-flight runs are cancelled
# if a newer commit arrives during deployment.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# ── Job 1: API → Fly.io ────────────────────────────────────────────────────────
jobs:
  deploy-api:
    name: API → Fly.io
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build

      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        # --remote-only builds the Docker image on Fly's infrastructure,
        # so we don't need Docker installed locally in the runner.
        run: flyctl deploy --remote-only

      - name: Skip Fly deploy
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN is not configured; API build passed and Fly deploy was skipped."

# ── Job 2: Web → Vercel ────────────────────────────────────────────────────────
  deploy-web:
    name: Web → Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    # Wait for the API to be live before shifting traffic to the new frontend,
    # so the first requests always hit an up-to-date backend.
    needs: deploy-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install -g vercel@latest

      # Pull project config and environment variables (including VITE_*)
      # from Vercel so the local build uses the same values as Vercel would.
      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Skip Vercel deploy
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not configured; web build passed and Vercel deploy was skipped."
