name: Deploy

on:
  push:
    branches: [main]

# Only one deployment runs at a time; in-flight runs are cancelled
# if a newer commit arrives during deployment.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# ── Job 1: API → Fly.io ────────────────────────────────────────────────────────
jobs:
  deploy-api:
    name: API → Fly.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # --remote-only builds the Docker image on Fly's infrastructure,
        # so we don't need Docker installed locally in the runner.
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

# ── Job 2: Web → Vercel ────────────────────────────────────────────────────────
  deploy-web:
    name: Web → Vercel
    runs-on: ubuntu-latest
    # Wait for the API to be live before shifting traffic to the new frontend,
    # so the first requests always hit an up-to-date backend.
    needs: deploy-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull project config and environment variables (including VITE_*)
      # from Vercel so the local build uses the same values as Vercel would.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
